<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR de registro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .hoja { background: #fff; color: #111; border-radius: 16px; padding: 32px 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hoja h1 { font-size: 2rem; }
    .hoja svg { width: min(320px, 100%); height: auto; margin: 20px auto; display: block; }
    .hoja p { font-size: 1.2rem; margin: 6px 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="hoja">
      <img src="logo.jpg" alt="" style="width:180px;height:180px;object-fit:cover;display:block;margin:-12px auto -8px">
      <h1 id="titulo" class="hidden">Barbería</h1>
      <p><b>Escanea para tomar tu turno</b></p>
      <div id="qr"></div>
      <p style="color:#555;font-size:.95rem">Apunta la cámara de tu celular al código</p>
    </div>
    <div class="no-print" style="margin-top:16px">
      <p class="muted small">Enlace del QR: <span id="url"></span></p>
      <button class="primary big" onclick="print()">Imprimir</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // El QR apunta directo al registro (turno.html), en la misma dirección donde está publicada esta página
    const url = new URL("turno.html", location.href).href;
    document.getElementById("titulo").textContent = window.BARBERIA.nombre;
    document.getElementById("url").textContent = url;
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  </script>
</body>
</html>
